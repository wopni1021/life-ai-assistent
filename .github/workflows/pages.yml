# Publishes both apps to GitHub Pages. It only copies files; the apps have no build step.
# Settings > Pages > Source must be "GitHub Actions".
name: Publish apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Put each app at its address
        run: |
          mkdir -p site/todo
          cp -R projects/expenses/app/. site/
          cp -R projects/todo/app/. site/todo/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
