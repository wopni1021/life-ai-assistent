# Tests the Expenses backend, then uploads it to Apps Script and updates the live web app at the same address.
# Secrets (repo Settings > Secrets and variables > Actions): CLASPRC_JSON, EXPENSES_SCRIPT_ID, EXPENSES_DEPLOYMENT_ID.
# To cover another tool: copy the deploy job, change the folder and add that tool's two ids.
name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'projects/expenses/backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: node projects/expenses/backend/tests/run-node.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/expenses/backend
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      SCRIPT_ID: ${{ secrets.EXPENSES_SCRIPT_ID }}
      DEPLOYMENT_ID: ${{ secrets.EXPENSES_DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm install -g @google/clasp@3.4.1
      - name: Write the sign-in and project files
        run: |
          umask 077
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          printf '{"scriptId":"%s","rootDir":"."}' "$SCRIPT_ID" > .clasp.json
      - name: Upload the code
        run: clasp push --force
      - name: Update the live web app
        run: clasp update-deployment "$DEPLOYMENT_ID" --description "$GITHUB_SHA"
