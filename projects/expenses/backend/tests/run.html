    expect: { direction: 'transfer', amount: 10000, account: 'ocbc-360', toAccount: '', status: 'review' } },
  { n: 'OCBC PayNow to a shop',
    from: OCBC, subj: 'PayNow transfer made',
    body: 'The following PayNow transfer has been made to KOPI SHOP PTE LTD using UEN (12345678X). Amount : SGD 6.50 From your account : 360 Account (-126666) Reference number : 1000000000000004 If you have any questions',
    expect: { direction: 'out', amount: 6.5, merchantRaw: 'KOPI SHOP PTE LTD', category: 'Dining', status: 'guess' } },
  { n: 'OCBC deposit from own name',

    body: 'Dear Valued Customer,\n\nA deposit was made in your account. Here are the details:\n\nTime of deposit: 6:30 PM\nAmount: SGD 1.00\nAccount that money was deposited in: (-126666)\nReference: from JANE TAN\n\nFor assistance at any time, please call us',

  { n: 'OCBC deposit from an employer',
    from: OCBC, subj: 'OCBC Alert: Deposit in your account',

  { n: 'OCBC unknown payment email goes to Unparsed', from: OCBC, subj: 'OCBC Alert: Something new', body: 'Something happened. Amount: SGD 12.00 on your account.', expectKind: 'unknown' },

  { n: 'UOB unknown wording is flagged', from: UOB, subj: 'UOB - Something new', body: 'We changed our terms.', expectKind: 'unknown' }
];

var fails = [], passed = 0;
cases.forEach(function (c) {
  var p = parseAlert_(c.from, c.subj, c.body);
  if (c.expectKind) {
    if (p.kind === c.expectKind) passed++; else fails.push(c.n + ': expected kind ' + c.expectKind + ', got ' + p.kind);
    return;
  }
  if (p.kind !== 'txn') { fails.push(c.n + ': not parsed (' + p.kind + ')'); return; }
  var row = buildRow_(p, ctx), bad = [];
  Object.keys(c.expect).forEach(function (k) {
    if (row[k] !== c.expect[k]) bad.push(k + ' expected ' + JSON.stringify(c.expect[k]) + ' got ' + JSON.stringify(row[k]));
  });
  if (bad.length) fails.push(c.n + ': ' + bad.join('; ')); else passed++;
});

    { datetime: '2026-10-05T10:00:00', direction: 'out', amount: 30, account: 'card', category: 'Groceries', status: 'ok' },

    { datetime: '2026-10-11T10:00:00', direction: 'out', amount: '', account: 'dbs', category: '', status: 'review' },
    { datetime: '2026-09-30T10:00:00', direction: 'out', amount: 99, account: 'dbs', category: 'Dining', status: 'ok' }
  ];
  var b = balances_(accts, rows), m = monthSummary_(rows, '2026-10');
  var byId = {}; b.accounts.forEach(function (a) { byId[a.id] = a; });
  function eq(name, got, want) {
    if (JSON.stringify(got) === JSON.stringify(want)) passed++;
    else fails.push('Ledger ' + name + ': expected ' + JSON.stringify(want) + ' got ' + JSON.stringify(got));
  }
  eq('dbs balance', byId.dbs.balance, 3688.66);
  eq('uob balance (dup ignored, card payment out)', byId.uob.balance, 675);
  eq('card balance', byId.card.balance, -30);
  eq('card since last payment', byId.card.sinceLastPayment, 10);
  eq('total money excludes card', b.totalMoney, 4363.66);
  eq('card owed', b.cardOwed, 30);
  eq('month total (purchases minus refunds, blank amount counts 0)', m.total, 55);
  eq('month categories', m.byCategory, [{ name: 'Groceries', total: 30 }, { name: 'Dining', total: 15 }, { name: 'Transport', total: 10 }, { name: 'Uncategorised', total: 0 }]);
  eq('month tags', m.byTag, [{ name: 'hawker', total: 20 }]);
  eq('review count', m.reviewCount, 1);
  eq('other month excluded', monthSummary_(rows, '2026-09').total, 99);
  eq('hand-added directions', ['refund', 'in', 'out', 'transfer', undefined].map(function (d) { return manualDirection_({ direction: d }); }), ['refund', 'in', 'out', 'out', 'out']);
  var rebates = rows.concat([
    { datetime: '2026-10-20T10:00:00', direction: 'refund', amount: 5, account: 'card', category: 'Rebate', status: 'ok' },
    { datetime: '2026-10-21T10:00:00', direction: 'refund', amount: 2, account: 'dbs', category: 'Rebate', status: 'ok' }

  var rb = balances_(accts, rebates), rbById = {};

  eq('rebates lower the month total', monthSummary_(rebates, '2026-10').total, 48);

  eq('guess rows count in balances', balances_(accts, guessed).totalMoney, 4356.66);
  eq('guess rows count in spending', monthSummary_(guessed, '2026-10').total, 62);
})();
