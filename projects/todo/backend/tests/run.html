var passed = 0, fails = [];
function ok(name, got, want) {
  var bad = Object.keys(want).filter(function (k) { return JSON.stringify(got[k]) !== JSON.stringify(want[k]); });
  if (bad.length) fails.push(name + ': ' + bad.map(function (k) { return k + ' got ' + JSON.stringify(got[k]) + ', want ' + JSON.stringify(want[k]); }).join('; '));
  else passed++;
}
